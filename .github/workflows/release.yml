name: release

# Build and publish the ki-ops wheel when a version tag is pushed.
#
# Consumers (kelaidata MWAA) install offline from a bundled wheelhouse
# (`--find-links /usr/local/airflow/plugins --no-index`), so the artifact of
# record is the pure-python wheel attached to the GitHub release:
#
#   git tag v0.2.0 && git push origin v0.2.0
#   -> release v0.2.0 with ki_ops-0.2.0-py3-none-any.whl (+ sdist + SHA256SUMS)
#
# kelaidata then vendors it with scripts/fetch_ki_ops_wheel.sh and pins
# `ki-ops==0.2.0` in requirements_airflow.txt. No AWS credentials are needed
# here; publishing uses only the workflow's GITHUB_TOKEN.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # MWAA (Airflow 2.10.x) runs Python 3.11; release from the same
          # runtime the wheel targets even though the package supports >=3.9.
          python-version: "3.11"

      - name: Verify tag matches pyproject version
        run: |
          python - <<'EOF'
          import os
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              sys.exit(
                  f"tag {tag!r} does not match pyproject version v{version}; "
                  "bump [project].version before tagging"
              )
          EOF

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify pure-python wheel
        run: |
          ls -l dist/
          version="${GITHUB_REF_NAME#v}"
          # The MWAA wheelhouse install is offline; a platform-specific wheel
          # would silently fail to resolve there, so fail the release instead.
          test -f "dist/ki_ops-${version}-py3-none-any.whl"

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --title "ki-ops $GITHUB_REF_NAME" \
            --notes "Pure-python wheel for the MWAA wheelhouse. Verify with SHA256SUMS. Consume in kelaidata via scripts/fetch_ki_ops_wheel.sh $GITHUB_REF_NAME."
