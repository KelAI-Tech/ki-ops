name: release

# Auto-release: every merge to main cuts a release with a derived tag.
#
# The version is derived from the latest v* tag by bumping the patch number
# (v0.2.0 -> v0.2.1). A manual major/minor bump is a workflow_dispatch run
# with an explicit `version` input (e.g. 1.0.0); subsequent merges then
# derive from that tag (1.0.1, 1.0.2, ...).
#
# The wheel version comes from the git tag via setuptools-scm (pyproject has
# no static version), so a released wheel can only ever carry the version of
# an existing tag. Ad-hoc wheels built from untagged commits get scm dev
# versions like 0.2.1.dev3+g1a2b3c4 that no `ki-ops==X.Y.Z` pin can match —
# the kelaidata wheelhouse can only consume real releases.
#
# Consumers (kelaidata MWAA) install offline from a bundled wheelhouse
# (`--find-links /usr/local/airflow/plugins --no-index`), so the artifact of
# record is the pure-python wheel attached to the GitHub release. kelaidata
# vendors it with scripts/fetch_ki_ops_wheel.sh and pins `ki-ops==X.Y.Z` in
# requirements_airflow.txt. The release job needs no AWS credentials;
# publishing uses only the workflow's GITHUB_TOKEN.
#
# Releasing the wheel and deploying the Batch image go hand in hand: the
# deploy-image job (self-hosted runner, label kelai-deploy) rebuilds the
# kelaidata/kotl-submit image FROM THE WHEEL THIS RUN JUST RELEASED and
# pushes it to ECR :latest — the tag the active `kotl-submit` Batch job
# definition points at, used by BOTH canary and prod DAGs. So every uat →
# main promotion ships the released code to the next scheduled Batch job
# with no manual build step.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Explicit version for a manual major/minor bump (e.g. 1.0.0).
          Leave empty to auto-bump the patch of the latest tag.
        required: false
        default: ""

permissions:
  contents: write

# Serialize releases so two merges cannot race the tag derivation.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: setuptools-scm and the tag derivation below
          # both need them.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # MWAA (Airflow 2.10.x) runs Python 3.11; release from the same
          # runtime the wheel targets even though the package supports >=3.9.
          python-version: "3.11"

      - name: Derive release version
        id: version
        env:
          EXPLICIT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)"
          latest="${latest:-v0.0.0}"
          if [ -n "$EXPLICIT_VERSION" ]; then
            version="$EXPLICIT_VERSION"
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::version input '$version' is not X.Y.Z" >&2
              exit 1
            fi
          else
            base="${latest#v}"
            major="${base%%.*}"; rest="${base#*.}"
            minor="${rest%%.*}"; patch="${rest#*.}"
            version="${major}.${minor}.$((patch + 1))"
          fi
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::tag ${tag} already exists" >&2
            exit 1
          fi
          echo "latest existing tag: ${latest}; releasing ${tag}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Tag release commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "ki-ops $TAG (auto-release from main @ $GITHUB_SHA)"
          git push origin "refs/tags/$TAG"

      - name: Build wheel and sdist
        # Built after tagging so setuptools-scm resolves the exact-tag
        # version and the wheel is ki_ops-<version>-py3-none-any.whl.
        #
        # --sdist --wheel builds BOTH directly from the source tree. The
        # default (no flags) builds the wheel from the unpacked sdist in a
        # temp dir with no .git metadata, so setup.py's git-SHA embedding
        # would write "unknown" and the verify step below would fail.
        run: python -m build --sdist --wheel

      - name: Verify pure-python wheel
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ls -l dist/
          # The MWAA wheelhouse install is offline; a platform-specific wheel
          # would silently fail to resolve there, so fail the release instead.
          test -f "dist/ki_ops-${VERSION}-py3-none-any.whl"

      - name: Verify embedded git SHA
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m pip install --force-reinstall "dist/ki_ops-${VERSION}-py3-none-any.whl"
          python - <<'EOF'
          import os
          import sys

          # Import the installed wheel, not the checkout's src/ tree.
          sys.path = [p for p in sys.path if not p.endswith("/src")]
          os.chdir("/tmp")

          import ki_ops

          sha = os.environ["GITHUB_SHA"]
          if ki_ops.__git_sha__ != sha:
              sys.exit(
                  f"wheel embeds git sha {ki_ops.__git_sha__!r}, expected {sha!r}"
              )
          print(f"ki-ops {ki_ops.__version__} @ {ki_ops.__git_sha__}")
          EOF

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --title "ki-ops $TAG" \
            --notes "Auto-release from main @ ${GITHUB_SHA}. Pure-python wheel for the MWAA wheelhouse; verify with SHA256SUMS. Consume in kelaidata via scripts/fetch_ki_ops_wheel.sh $TAG."

  deploy-image:
    # Build and push the kotl-submit AWS Batch image from the wheel the
    # release job just published. Runs on the self-hosted dev-box runner
    # (label kelai-deploy): unlike GitHub-hosted runners it has docker, AWS
    # credentials with S3 read (Brooklyn SDK sync) + ECR push rights, and gh
    # auth that can clone the private kelaidata repo. The Dockerfile and
    # build.sh stay in kelaidata (single source of truth); this job only
    # stages the released wheel and drives them.
    #
    # Tags pushed: :latest and :<kelaidata-sha> (by build.sh, the tags the
    # Batch job definition and rollbacks use) plus :ki-ops-<release-tag> for
    # release-to-image traceability.
    needs: release
    runs-on: [self-hosted, kelai-deploy]
    env:
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.version }}
      AWS_REGION: us-east-1
    steps:
      - name: Build and push kotl-submit image from released wheel
        run: |
          set -euo pipefail
          # Self-hosted runner: the runner service's PATH is minimal — gh is
          # a user-dir install (v0.3.6 release: `gh: command not found`,
          # exit 127, no image pushed). docker/aws are system-wide.
          export PATH="/udata/home/jercoh/.local/bin:$HOME/.local/bin:$PATH"
          command -v gh >/dev/null || { echo "gh not on runner PATH" >&2; exit 1; }
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          # kelaidata uat is the deployed docker context convention.
          gh repo clone KelAI-Tech/kelaidata "$work/kelaidata" -- --depth 1 --branch uat

          # Stage EXACTLY the wheel this run released (build.sh picks the
          # first plugins/ki_ops-*.whl, so clear any vendored ones first).
          rm -f "$work/kelaidata/plugins"/ki_ops-*.whl
          gh release download "$TAG" --repo KelAI-Tech/ki-ops \
            --pattern 'ki_ops-*.whl' --dir "$work/kelaidata/plugins"
          ls -l "$work/kelaidata/plugins"/ki_ops-*.whl

          "$work/kelaidata/docker/kotl-submit/build.sh"

          # Release-traceable extra tag.
          account="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          docker tag kelaidata/kotl-submit:latest \
            "${registry}/kelaidata/kotl-submit:ki-ops-${TAG}"
          docker push "${registry}/kelaidata/kotl-submit:ki-ops-${TAG}"

      - name: Verify deployed image version
        run: |
          set -euo pipefail
          info="$(docker run --rm --entrypoint pip kelaidata/kotl-submit:latest show ki-ops)"
          printf '%s\n' "$info"
          printf '%s\n' "$info" | grep -qx "Version: ${VERSION}"
          echo "kotl-submit:latest now runs the released ki-ops ${VERSION}"
