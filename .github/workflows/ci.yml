name: ci

# Test every PR (feature -> uat and uat -> main). Releases from main run the
# suite again in release.yml before tagging, so a red main can never release.

on:
  pull_request:
  push:
    branches:
      - uat

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm needs the tag history to derive a version.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q
