# Local MySQL for KOTL --store mysql development.
#
#   docker compose -f docker-compose.kotl-db.yml up -d
#   export KOTL_DB_HOST=127.0.0.1 KOTL_DB_PORT=3307 \
#          KOTL_DB_USER=root KOTL_DB_PASSWORD=kotl KOTL_DB_SCHEMA=kelai
#   ki-ops kotl status --trade-date 2026-09-04 --store mysql
services:
  kotl-db:
    image: mysql:8
    container_name: kotl-db
    environment:
      MYSQL_ROOT_PASSWORD: kotl
      MYSQL_DATABASE: kelai
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pkotl"]
      interval: 5s
      timeout: 3s
      retries: 20
