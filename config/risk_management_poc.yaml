# Risk limits sized for the ~$90M GMV alpha dollar panel POC (July 2026).
risk_management:
  enabled: true

  # max abs share qty (SOD $ notional / trade-time px); ~max_portfolio_value/2 × conc / 5 historically
  max_position_size: 300000
  max_portfolio_value: 100000000   # max GMV + cash (~$90M book + headroom)
  max_daily_loss: 2000000
  max_position_concentration: 0.03 # 3% of position GMV (cash excluded)

  max_position_volatility: 0.3
  volatility_lookback: 30

  use_stop_losses: false
  default_stop_loss: 0.05
  trailing_stop: true
  trailing_stop_distance: 0.02

  # Order size checks off across all scenarios
  enforce_order_size_limits: false
  min_order_size: 1
  max_order_size: 750000  # unused while enforce_order_size_limits is false
  max_orders_per_minute: 100000

  enforce_market_hours: false
  pre_market_trading: false
  after_hours_trading: false

  # Two-way (kelaisim convention): (buy$ + sell$) / position GMV.
  # One-way = half of this, so 0.5 two-way == the old 0.25 one-way cap.
  max_turnover: 0.5
  allow_shorts: true
