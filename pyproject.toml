[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ki-ops"
version = "0.3.0"
description = "Deterministic KI Ops library for trade analysis, portfolio holdings, pre-trade checks, and market-neutral risk snapshots"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Robert Bai" }]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
alpha = [
  "pandas>=2.0",
  "pyarrow>=14",
]
kelaidata = [
  "h5py>=3.10",
  "numpy>=1.24",
  "boto3>=1.34",
]
flex = [
  "grpcio>=1.60",
  # The Brooklyn SDK's generated *_pb2 modules import google.protobuf
  # directly; grpcio does NOT pull protobuf in, so it must be explicit.
  "protobuf>=4.25",
  "boto3>=1.34",
]
db = [
  "mysql-connector-python>=8.3",
]
secmaster = [
  "snowflake-connector-python>=3.12",
  "cryptography>=42",
  "boto3>=1.34",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pandas>=2.0",
  "pyarrow>=14",
  "h5py>=3.10",
  "numpy>=1.24",
  "boto3>=1.34",
  "mysql-connector-python>=8.3",
]

[project.scripts]
ki-ops = "ki_ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
